name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # Rebuilds every day, so engine updates reach the site without a push here.
  schedule:
    - cron: "23 4 * * *"
  # Or rebuild now: Actions > Build and deploy > Run workflow.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Installs the engine's latest version, as package-lock.json isn't committed.
      - run: npm install
      # With no `url:` in site.yaml, build for this repo's GitHub Pages address (custom domain included).
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Set the site's URL
        if: github.event_name != 'pull_request'
        run: grep -q '^url:' site.yaml || echo "url: ${{ steps.pages.outputs.base_url }}" >> site.yaml
      # Every place must already be in data/places.json (run `npm run check` locally to fill it in).
      - run: npm run check -- --offline
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
