<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%BASE_URL%favicon/favicon.ico" />
    <title>Studio · %SITE_TITLE%</title>
    <script>
      // Same saved theme as the globe (src/lib/theme.ts).
      try {
        var t = localStorage.getItem("travel-history:theme") || "dark";
        var dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/studio/main.tsx"></script>
  </body>
</html>
