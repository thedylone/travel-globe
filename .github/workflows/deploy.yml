name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The site shows this repo's own data (site.yaml, data/, public/photos/) until it moves to its own repo.
      TRAVEL_HISTORY_DATA: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Every place must already be in data/places.json (run `npm run check` locally to fill it in).
      - run: npm run check -- --offline
      - run: npm run build
      # The sample trips that come with the engine must build too.
      - run: npm run check -- --offline --data example
      - run: npx travel-history build --data example --out ${{ runner.temp }}/example
      # Fails if the globe goes over its draw-call budget (see scripts/perf.ts).
      - run: npx playwright install --with-deps chromium
      - run: npm run perf
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
