name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The demo site: the sample trips in example/, built for this repo's Pages address.
      - name: Prepare the demo
        run: |
          cp -r example "$RUNNER_TEMP/demo"
          echo "url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$RUNNER_TEMP/demo/site.yaml"
          echo "TRAVEL_GLOBE_DATA=$RUNNER_TEMP/demo" >> "$GITHUB_ENV"
      - run: npm run check -- --offline
      - run: npm run build
      # Fails if the globe goes over its draw-call budget (see scripts/perf.ts).
      - run: npx playwright install --with-deps chromium
      - run: npm run perf
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
