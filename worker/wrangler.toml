# The trip planner's sync server: shares a plan between phones. See worker/README.md.
name = "planner-sync"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Its own address, for short share links (plan.thedylone.com/<code>). The deploy makes the domain and
# its DNS record, as long as the domain's DNS is on Cloudflare. The workers.dev address stays on, so
# links made with it keep working.
routes = [{ pattern = "plan.thedylone.com", custom_domain = true }]
workers_dev = true

[vars]
# Sites allowed to call it from a browser, comma-separated, with no trailing slash.
ALLOWED_ORIGINS = "https://travel.thedylone.com,http://localhost:5173"
# The planner, where share links go. Its preview.png (made with the site) is the links' picture.
PLANNER_URL = "https://travel.thedylone.com/planner/"

# One Durable Object per shared plan, so two phones saving at once are handled one after the other.
[[durable_objects.bindings]]
name = "PLANS"
class_name = "PlanRoom"

# The free plan only has Durable Objects that keep their data in SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlanRoom"]
