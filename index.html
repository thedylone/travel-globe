<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#040e20" />
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <link rel="icon" href="%BASE_URL%favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>%SITE_TITLE%</title>
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts), so pages don't flash.
      try {
        var t = localStorage.getItem("travel-history:theme") || "dark";
        var dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <!-- Link-preview tags from site.yaml (scripts/vite-plugin-travel-data.ts). -->
    <!-- %SITE_PREVIEW% -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
